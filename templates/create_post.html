{% extends "base.html" %}

{% block title %}发布新帖 - ThinkShare{% endblock %}

{% block content %}
<div class="main-layout" style="justify-content:center;">
    <div class="create-post-page">

        <div class="editor-wrapper">
            <div class="editor-header">
                <h2>发布新帖</h2>
            </div>

            <form method="POST" action="{{ url_for('create_post') }}" id="post-form">
                <div class="form-inline">
                    <div class="form-group" style="flex:1;">
                        <label for="title">标题</label>
                        <input type="text" id="title" name="title" placeholder="请输入标题" required>
                    </div>
                    <div class="form-group" style="width:180px;flex-shrink:0;">
                        <label for="category">板块</label>
                        <select id="category" name="category" required>
                            <option value="">选择板块</option>
                            <option value="daily">日常生活</option>
                            <option value="news">时事新闻</option>
                            <option value="academic">学术科研</option>
                            <option value="trade">二手交易</option>
                        </select>
                    </div>
                </div>

                <div class="form-group editor-container">
                    <label>内容（支持 Markdown，可拖拽/粘贴图片）</label>
                    <textarea id="content" name="content"></textarea>
                </div>

                <div class="editor-actions">
                    <a href="{{ url_for('forum') }}" class="btn btn-outline">取消</a>
                    <button type="submit" class="btn btn-primary" style="width:auto;">发布帖子</button>
                </div>
            </form>
        </div>

    </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
<style>
.editor-container{opacity:0;transition:opacity .2s}.editor-ready{opacity:1}
</style>
<script src="https://cdn.jsdelivr.net/simplemde/latest/simplemde.min.js"></script>
<script>
var simplemde = new SimpleMDE({
    element: document.getElementById("content"),
    spellChecker: false,
    placeholder: "分享你的想法...",
    toolbar: ["bold","italic","heading","|","quote","unordered-list","ordered-list","|","link",
        {name:"upload-image",action:function(e){var i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=function(){if(this.files&&this.files[0])handleImageFile(this.files[0])};i.click()},className:"fa fa-picture-o",title:"上传图片"},
        "|","preview","side-by-side","fullscreen","|","guide"]
});

function uploadImage(file, onSuccess, onError) {
    var formData = new FormData();
    formData.append("image", file);
    fetch("{{ url_for('upload_image') }}", {method:"POST",body:formData})
    .then(function(r){return r.json()})
    .then(function(d){if(d.url)onSuccess(d.url);else onError(d.error||"")})
    .catch(function(){onError("")});
}

document.querySelector('.editor-container').classList.add('editor-ready');
document.getElementById('post-form').addEventListener('submit', function(e) {
    var c = document.getElementById('category').value;
    var t = document.getElementById('title').value.trim();
    var ct = simplemde.value().trim();
    if(!c){e.preventDefault();alert('请选择板块');return}
    if(!t){e.preventDefault();alert('请输入标题');return}
    if(!ct){e.preventDefault();alert('请输入内容');return}
});

var cm = simplemde.codemirror;
var cmWrapper = cm.getWrapperElement();

function insertImageTag(url) {
    var w = prompt('请输入图片显示宽度（如 600 或 80%，留空默认自适应）：', '');
    var widthAttr = '';
    if (w) {
        var trimmed = w.trim();
        if (/^\d+$/.test(trimmed)) { trimmed += 'px'; }
        widthAttr = ' width="' + trimmed.replace(/"/g, '') + '"';
    }
    var doc = cm.getDoc();
    var cursor = doc.getCursor();
    doc.replaceRange('\n<img src="' + url + '"' + widthAttr + '>\n', cursor);
}

function handleImageFile(file) {
    if (!file || !file.type.match(/^image\//)) return false;
    uploadImage(file, function(url) {
        insertImageTag(url);
    }, function() {
        alert('图片上传失败，请重试');
    });
    return true;
}

cm.on('paste', function(instance, e) {
    var items = (e.clipboardData || window.clipboardData).items;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
        if (items[i].type.match(/^image\//)) {
            e.preventDefault();
            handleImageFile(items[i].getAsFile());
            return;
        }
    }
});

cmWrapper.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.stopPropagation();
});

cmWrapper.addEventListener('drop', function(e) {
    e.preventDefault();
    e.stopPropagation();
    var files = e.dataTransfer.files;
    if (files && files.length > 0) {
        for (var i = 0; i < files.length; i++) {
            handleImageFile(files[i]);
        }
    }
});
</script>
{% endblock %}
