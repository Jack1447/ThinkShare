<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <title>登录 - ThinkShare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-box">
        <h1><img src="{{ url_for('static', filename='img/favicon.svg') }}" alt="logo" class="auth-logo"><span class="brand-fancy">𝓣</span>hink<span class="brand-fancy">𝓢</span>hare</h1>
        <h2>登录</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="toast-container" id="flash-container">
                    {% for category, message in messages %}
                        <div class="toast toast-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">登录</button>
        </form>

        <p class="auth-link">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></p>
    </div>

<script>
(function() {
    var container = document.getElementById('flash-container');
    if (container) {
        var toasts = container.querySelectorAll('.toast');
        toasts.forEach(function(toast) {
            toast.classList.add('toast-in');
            setTimeout(function() {
                toast.classList.add('toast-out');
                setTimeout(function() {
                    toast.remove();
                    if (container.querySelectorAll('.toast').length === 0) {
                        container.remove();
                    }
                }, 400);
            }, 3000);
        });
    }
})();
</script>
</body>
</html>
