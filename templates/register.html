<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - ThinkShare</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-box">
        <h1><span class="brand-fancy">𝓣</span>hink<span class="brand-fancy">𝓢</span>hare</h1>
        <h2>注册新账号</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-{{ category }} flash-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('register') }}" enctype="multipart/form-data">
            <div class="form-group" style="text-align:center;">
                <div class="avatar-upload" onclick="document.getElementById('avatar').click()">
                    <img id="avatar-preview" src="{{ url_for('static', filename='img/default_avatar.svg') }}" alt="头像预览">
                    <span class="avatar-upload-hint">点击上传头像</span>
                </div>
                <input type="file" id="avatar" name="avatar" accept="image/*" style="display:none;" onchange="previewAvatar(this)">
            </div>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" placeholder="请设置登录用户名" required>
            </div>
            <div class="form-group">
                <label for="nickname">昵称</label>
                <input type="text" id="nickname" name="nickname" placeholder="你在论坛中的显示名称" required>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="至少6位密码" required>
            </div>
            <div class="form-group">
                <label for="password_confirm">确认密码</label>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="再次输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary">注册</button>
        </form>

        <p class="auth-link">已有账号？<a href="{{ url_for('login') }}">立即登录</a></p>
    </div>

    <script>
    function previewAvatar(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatar-preview').src = e.target.result;
            };
            reader.readAsDataURL(input.files[0]);
        }
    }
    </script>
</body>
</html>
